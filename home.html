<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>RedderBlanket</title>
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

		body { font-family: "Inter", sans-serif; margin: 0 1em; gap: 1em; display: flex; justify-content: center; line-height: 1.5em; background-color: #0e1111; color: #eeeef5; }
		main { max-width: 900px; padding: 1em 0; }
		a { color: #03fc9d; }
		h1 { text-align: center; font-size: 1.25em; }
		h2 { font-size: 1.3em; padding-bottom: 0.2em; }
		aside { width: 320px; flex-shrink: 0; min-height: 100vh; background: #1c1e23; border-left: 4px solid #03fc9d; border-right: 1px solid #484848; }
		header { background: black; height: 100px; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; background-size: 120%; background-position-x: 80%; background-image: url("https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/f7195997-7848-47de-bc04-bb31e278204f/dk577qb-69732f27-9a2a-4bb8-90a9-8b44a1479a67.png/v1/fill/w_1032,h_774,q_70,strp/dragon_doodle_collage_by_redderblanket_dk577qb-pre.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9OTYwIiwicGF0aCI6Ii9mL2Y3MTk1OTk3LTc4NDgtNDdkZS1iYzA0LWJiMzFlMjc4MjA0Zi9kazU3N3FiLTY5NzMyZjI3LTlhMmEtNGJiOC05MGE5LThiNDRhMTQ3OWE2Ny5wbmciLCJ3aWR0aCI6Ijw9MTI4MCJ9XV0sImF1ZCI6WyJ1cm46c2VydmljZTppbWFnZS5vcGVyYXRpb25zIl19.LNWFPSJjYsdImjPNKm99t0m3uixN7dNZitp8c6jobTE"); }
		header img, header h1 { border-radius: 4px; transform: translateY(69px); }
	
		/* articles */
		gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 1rem; }

		article { aspect-ratio: 1; background: #1c1e23; border: 1px solid #484848; border-radius: 0.5em; overflow: hidden; }
		article img { width: 100%; height: 50%; object-fit: cover; object-position: center top; }
		article div { padding: 0.5em 1em; }
		article h3 { font-size: 1em; margin: 0; display: flex; align-items: center; gap: 4px; }
		article p { margin: 0.35em 0; }

		.fake-article { aspect-ratio: 1; background: #18191d; border-radius: 0.5em; }
		
		/* cool buttons*/
		a.green, a.grey { cursor: pointer; border: 0; flex: 34px 0 0; width: 34px; height: 32px; border-radius: 2px; display: flex; justify-content: center; align-items: center; }
		a.green { background: #03fc9d; }
		a.green:hover { background: #8effa1; }
		a.grey { background: none; }
		a.grey:hover { background: #444; }

		/* mobile/narrow monitors */
		@media (width <= 1124px) {
			.fake-article:last-of-type { display: none; }
		}

		@media (orientation: portrait), (width <= 900px) {
			body { flex-direction: column; }
			aside { min-height: 0; width: 100%; }
			.fake-article { display: none; }
			article { aspect-ratio: 2; }
			gallery { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<aside>
		<header>
			<img src="https://a.deviantart.net/avatars-big/r/e/redderblanket.jpg?2">
			<h1>RedderBlanket</h1>
		</header>
		<div style="padding: 1em; padding-top: 5em;">
			<p>BBW/hyper artist. I like human, anthro, and pony characters. I'm trying to draw more often.</p>
			<p>I'm here to have fun!!</p>
			<p>You can find all my art on <a href="https://www.deviantart.com/redderblanket">DeviantArt</a>.</p>
		</div>
	</aside>

	<main>
		<h2>Mods</h2>
		<gallery>
			<!-- insert mods -->
		</gallery>

		<h2>Art projects</h2>
		<gallery>
			<!-- insert art projects -->
		</gallery>
	</main>
</body>
</html>
