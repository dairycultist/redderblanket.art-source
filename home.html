<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>RedderBlanket</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");

		:root { --accent: #fc4532; }

		body { font-family: "Inter", sans-serif; margin: 0 1em; gap: 1em; display: flex; justify-content: center; line-height: 1.5em; background-color: #0e1111; color: #eeeef5; }
		main { max-width: 900px; padding: 1em 0; }
		a { color: var(--accent); }
		h1 { text-align: center; font-size: 1.25em; }
		h2 { font-size: 1.3em; padding-bottom: 0.2em; }
		aside { width: 320px; flex-shrink: 0; min-height: 100vh; background: #1c1e23; border-left: 4px solid var(--accent); border-right: 1px solid #484848; }
		header { background: var(--accent); height: 100px; width: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; }
		header img, header h1 { border-radius: 4px; transform: translateY(69px); }
	
		/* articles */
		gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 1rem; }

		article { aspect-ratio: 1; background: #1c1e23; border: 1px solid #484848; border-radius: 0.5em; overflow: hidden; }
		article img { width: 100%; height: 50%; object-fit: cover; object-position: center top; }
		article div { padding: 0.5em 1em; }
		article h3 { font-size: 1em; margin: 0; display: flex; align-items: center; gap: 4px; }
		article p { margin: 0.35em 0; }

		.fake-article { aspect-ratio: 1; background: #18191d; border-radius: 0.5em; }
		
		/* cool buttons*/
		a.green, a.grey { cursor: pointer; border: 0; flex: 34px 0 0; width: 34px; height: 32px; border-radius: 2px; display: flex; justify-content: center; align-items: center; }
		a.green { background: var(--accent); }
		a.green:hover { background: color-mix(in oklab, var(--accent), black 20%); }
		a.grey { background: none; }
		a.grey:hover { background: #444; }

		a.grey:has(+ a.green[style*="display: none;"]) { transform: translateX(6px); } /* scuffed css trickery */

		/* mobile/narrow monitors */
		@media (width <= 1124px) {
			.fake-article:last-of-type { display: none; }
		}

		@media (orientation: portrait), (width <= 900px) {
			body { flex-direction: column; }
			aside { min-height: 0; width: 100%; }
			.fake-article { display: none; }
			article { aspect-ratio: 2; }
			gallery { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<aside>
		<header>
			<img src="https://a.deviantart.net/avatars-big/r/e/redderblanket.jpg?2">
			<h1>RedderBlanket</h1>
		</header>
		<div style="padding: 1em; padding-top: 5em;">
			<p>I'm a BBW/hyper artist. I like to draw and have fun :)</p>
			<p>This website is where I post all of my art <i>projects</i>. You can find all my <i>art</i> art on <a href="https://www.deviantart.com/redderblanket">DeviantArt</a>.</p>
		</div>
	</aside>

	<main>
		<h2>Games/Mods</h2>
		<gallery>
			<!-- insert games -->
		</gallery>

		<h2>Worldbuilding</h2>
		<gallery>
			<!-- insert worlds -->
		</gallery>
	</main>
</body>
</html>
